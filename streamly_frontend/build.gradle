/*
 Root build script for the Streamly Android project.
 Standard repositories and Android/Kotlin plugin management at the root.
 This ensures standard tasks like `clean` are available and modules resolve correctly.
*/
buildscript {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
    dependencies {
        // Explicit versions per project policy
        classpath "com.android.tools.build:gradle:8.5.2"
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.24"
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

// Optional: root lint convenience delegator
tasks.register("lint") {
    group = "verification"
    description = "Runs Android Lint for the app module."
    dependsOn(":app:lint")
}
